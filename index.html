<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>KEDAI RAFFA POS</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png">

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- App Modules -->
  <script src="/js/supabase-client.js"></script>
  <script src="/js/bluetooth-printer.js"></script>
  <script src="/js/push-notification.js"></script>
  <script src="/js/app.js"></script>

  <style>
    :root {
      --primary: #e94560;
      --dark: #1a1a2e;
      --light: #f5f5f5;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--dark);
      color: var(--light);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .container { max-width: 480px; margin: 0 auto; padding: 16px; }
    .header {
      text-align: center;
      padding: 24px 0;
      border-bottom: 2px solid var(--primary);
      margin-bottom: 24px;
    }
    .header h1 { color: var(--primary); font-size: 28px; letter-spacing: 2px; }
    .header p { color: #888; font-size: 12px; margin-top: 4px; }

    .card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card h3 { color: var(--primary); margin-bottom: 12px; font-size: 16px; }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-success { background: var(--success); color: white; }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-ok { background: rgba(40,167,69,0.2); color: var(--success); }
    .status-warn { background: rgba(255,193,7,0.2); color: var(--warning); }
    .status-err { background: rgba(220,53,69,0.2); color: var(--danger); }

    .input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: var(--light);
      font-size: 16px;
      margin-bottom: 12px;
    }
    .input:focus { outline: none; border-color: var(--primary); }

    .printer-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .printer-info .icon { font-size: 24px; }
    .printer-info .detail { flex: 1; }
    .printer-info .detail .name { font-weight: 600; }
    .printer-info .detail .status { font-size: 12px; color: #888; }

    .hidden { display: none !important; }

    /* Loading */
    .loading {
      position: fixed; inset: 0;
      background: var(--dark);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
    }
    .loading .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(233,69,96,0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p style="margin-top:16px;color:#888;font-size:14px;">Memuat KEDAI RAFFA...</p>
  </div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🍽️ KEDAI RAFFA</h1>
      <p>POS SYSTEM v1.5.0</p>
    </div>

    <!-- Login Section -->
    <div id="login-section" class="card">
      <h3>🔐 Masuk dengan Kode Akses</h3>
      <input type="password" id="kode-akses" class="input" placeholder="Masukkan kode akses..." maxlength="6">
      <button class="btn btn-primary" onclick="appLogin()">MASUK</button>
      <p id="login-error" style="color:var(--danger);font-size:13px;text-align:center;margin-top:8px;display:none;"></p>
    </div>

    <!-- Dashboard (Hidden until login) -->
    <div id="dashboard" class="hidden">
      <!-- User Info -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <p style="font-size:12px;color:#888;">Selamat datang,</p>
            <p id="user-name" style="font-size:18px;font-weight:700;">-</p>
          </div>
          <span id="user-role" class="status-badge status-ok">-</span>
        </div>
      </div>

      <!-- Printer Status -->
      <div class="card">
        <h3>🖨️ Printer Bluetooth</h3>
        <div id="printer-status">
          <div class="printer-info">
            <span class="icon">🖨️</span>
            <div class="detail">
              <div class="name" id="printer-name">Belum dipair</div>
              <div class="status" id="printer-state">Tekan "Pair Printer" untuk menghubungkan</div>
            </div>
            <span id="printer-badge" class="status-badge status-err">OFF</span>
          </div>
        </div>
        <button class="btn btn-outline" id="btn-pair" onclick="pairPrinter()">🔗 Pair Printer</button>
        <button class="btn btn-outline" id="btn-test-print" onclick="testPrint()" style="display:none;">🧪 Test Print</button>
        <button class="btn btn-outline" id="btn-forget" onclick="forgetPrinter()" style="display:none;color:var(--danger);border-color:var(--danger);">❌ Lupakan Printer</button>
      </div>

      <!-- Push Notification -->
      <div class="card">
        <h3>🔔 Notifikasi Push</h3>
        <p id="push-status" style="font-size:13px;color:#888;margin-bottom:12px;">Status: Belum diaktifkan</p>
        <button class="btn btn-outline" id="btn-push" onclick="enablePush()">🔔 Aktifkan Notifikasi</button>
      </div>

      <!-- Quick Actions -->
      <div class="card">
        <h3>⚡ Aksi Cepat</h3>
        <button class="btn btn-primary" onclick="openKasir()">💰 Buka Kasir</button>
        <button class="btn btn-success" onclick="openMonitoring()">📊 Monitoring</button>
        <button class="btn btn-warning" onclick="openStok()">📦 Cek Stok</button>
      </div>

      <button class="btn btn-outline" onclick="appLogout()" style="color:#888;border-color:#444;">🚪 Keluar</button>
    </div>
  </div>

  <script>
    // ============================================================
    // KONFIGURASI — GANTI DENGAN DATA SUPABASE ANDA
    // ============================================================
    const CONFIG = {
      supabaseUrl: 'https://YOUR_PROJECT_ID.supabase.co',
      supabaseKey: 'YOUR_ANON_PUBLIC_KEY',
      vapidPublicKey: 'YOUR_VAPID_PUBLIC_KEY'
    };

    let app = null;
    let printer = null;

    // Init saat load
    document.addEventListener('DOMContentLoaded', async () => {
      app = new KedaiRaffaApp();
      await app.init(CONFIG);

      // Cek session
      const user = app.supabase.getCurrentUser();
      if (user.id) {
        showDashboard(user);
      } else {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('login-section').style.display = 'block';
      }

      updatePrinterUI();
    });

    // ── LOGIN ──
    async function appLogin() {
      const kode = document.getElementById('kode-akses').value.trim();
      if (!kode) return;

      const result = await app.login(kode);
      if (result.success) {
        showDashboard(result.user);
      } else {
        const err = document.getElementById('login-error');
        err.textContent = result.error;
        err.style.display = 'block';
      }
    }

    function showDashboard(user) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('user-name').textContent = user.nama || user.name;
      document.getElementById('user-role').textContent = (user.role || 'unknown').toUpperCase();
      updatePrinterUI();
      updatePushUI();
    }

    // ── LOGOUT ──
    function appLogout() {
      app.logout();
      location.reload();
    }

    // ── PRINTER ──
    async function pairPrinter() {
      printer = app.printer;
      try {
        const result = await printer.scanAndPair();
        alert(`Printer terhubung: ${result.name}`);
        updatePrinterUI();
      } catch (error) {
        alert('Gagal pair printer: ' + error.message);
      }
    }

    async function testPrint() {
      try {
        await app.printer.printTest();
        alert('Test print berhasil!');
      } catch (error) {
        alert('Gagal test print: ' + error.message);
      }
    }

    async function forgetPrinter() {
      await app.printer.forget();
      updatePrinterUI();
    }

    function updatePrinterUI() {
      if (!app || !app.printer) return;
      const status = app.printer.getStatus();

      document.getElementById('printer-name').textContent = status.printerName || 'Belum dipair';
      document.getElementById('printer-state').textContent = status.isConnected 
        ? 'Printer terhubung dan siap' 
        : (status.printerName ? 'Printer terputus, klik Pair untuk reconnect' : 'Tekan "Pair Printer" untuk menghubungkan');

      const badge = document.getElementById('printer-badge');
      badge.textContent = status.isConnected ? 'ON' : 'OFF';
      badge.className = 'status-badge ' + (status.isConnected ? 'status-ok' : 'status-err');

      document.getElementById('btn-test-print').style.display = status.isConnected ? 'block' : 'none';
      document.getElementById('btn-forget').style.display = status.printerName ? 'block' : 'none';
    }

    // Listen printer events
    window.addEventListener('printer:connected', updatePrinterUI);
    window.addEventListener('printer:disconnected', updatePrinterUI);

    // ── PUSH NOTIFICATION ──
    async function enablePush() {
      const result = await app.push.subscribe();
      if (result.success) {
        alert('Notifikasi push aktif!');
      } else {
        alert('Gagal aktifkan notifikasi: ' + result.error);
      }
      updatePushUI();
    }

    function updatePushUI() {
      if (!app || !app.push) return;
      const status = app.push.getStatus();
      const el = document.getElementById('push-status');
      const btn = document.getElementById('btn-push');

      if (!status.isSupported) {
        el.textContent = 'Status: Browser tidak mendukung push notification';
        btn.style.display = 'none';
      } else if (status.isSubscribed) {
        el.textContent = 'Status: Aktif ✅';
        btn.style.display = 'none';
      } else if (status.permission === 'denied') {
        el.textContent = 'Status: Izin ditolak. Buka pengaturan browser untuk mengizinkan.';
        btn.style.display = 'none';
      } else {
        el.textContent = 'Status: Belum diaktifkan';
        btn.style.display = 'block';
      }
    }

    // ── NAVIGATION PLACEHOLDERS ──
    function openKasir() { alert('Mode Kasir — implementasi UI di sini'); }
    function openMonitoring() { alert('Monitoring — implementasi UI di sini'); }
    function openStok() { alert('Cek Stok — implementasi UI di sini'); }
  </script>
</body>
</html>
