name: 🚀 Auto Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy commit ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📥 Checkout latest commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 🔍 Show commit info
        run: |
          echo "=================================="
          echo "Deploying commit : ${{ github.sha }}"
          echo "Branch           : ${{ github.ref_name }}"
          echo "Author           : ${{ github.actor }}"
          echo "Message          : ${{ github.event.head_commit.message }}"
          echo "Triggered by     : ${{ github.event_name }}"
          echo "=================================="

      - name: 🌩️ Deploy to Cloudflare Pages (Wrangler)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=kedai-raffa-pos --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message }}"

      - name: ✅ Deploy selesai
        run: |
          echo "Deploy berhasil!"
          echo "Commit ${{ github.sha }} sudah live di https://kedai-raffa-pos.pages.dev"
